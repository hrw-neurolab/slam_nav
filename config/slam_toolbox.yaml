# SLAM Toolbox for the worlds of day 7 (slides 11 and 12).
# Copy of slam_toolbox/config/mapper_params_online_sync.yaml of Kilted,
# the file Nav2's slam:=True starts with. Changed:
#   min_laser_range    0.12 instead of 0.0, and max_laser_range 3.5 instead of 20.0:
#                      the range of our lidar (laser_sim range_min and range_max)
#   use_lifecycle_manager   true, our launch file activates the node like the Nav2 nodes
#   transform_timeout  0.5 instead of 0.2. SLAM Toolbox stamps map -> odom this far ahead
#                      of the last scan. With 0.2 our Python simulator was sometimes too slow
#                      and Nav2 failed with "Lookup would require extrapolation into the future".
#   minimum_travel_distance  0.25 instead of 0.5: a new scan every 25 cm. A loop closure needs a
#                      chain of 10 matching scans (loop_match_minimum_chain_size), that is 2.5 m
#                      of corridor instead of 5 m, so the loop of slide 8 can close at all.
#   loop_search_space_dimension  3.0 instead of 8.0: a loop closure may move the robot at most
#                      1.5 m. With 8.0 SLAM sometimes matched the right half of the room with
#                      the left half and glued them together, a wrong loop closure (slide 8).
# The launch file also sets do_loop_closing and max_laser_range from its arguments
# loop_closing:= and range_max:=, those values win over this file.
slam_toolbox:
  ros__parameters:

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_map_saver: true
    mode: mapping #localization
    use_lifecycle_manager: true

    # if you'd like to immediately start continuing a map at a given pose
    # or at the dock, but they are mutually exclusive, if pose is given
    # will use pose
    #map_file_name: test_steve
    #map_start_pose: [0.0, 0.0, 0.0]
    #map_start_at_dock: true

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02 #if 0 never publishes odometry
    map_update_interval: 5.0
    resolution: 0.05
    min_laser_range: 0.12 # = laser_sim range_min
    max_laser_range: 3.5 # = laser_sim range_max, the range of our lidar
    minimum_time_interval: 0.5
    transform_timeout: 0.5 # 0.2 in the original, see the comment at the top
    tf_buffer_duration: 30.
    stack_size_to_use: 40000000 #// program needs a larger stack size to serialize large maps
    enable_interactive_mode: true

    # General Parameters
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.25 # 0.5 in the original, see the comment at the top
    minimum_travel_heading: 0.5
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1  
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true 
    loop_match_minimum_chain_size: 10           
    loop_match_maximum_variance_coarse: 3.0  
    loop_match_minimum_response_coarse: 0.35    
    loop_match_minimum_response_fine: 0.45

    # Correlation Parameters - Correlation Parameters
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1 

    # Correlation Parameters - Loop Closure Parameters
    loop_search_space_dimension: 3.0 # 8.0 in the original, see the comment at the top
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    distance_variance_penalty: 0.5      
    angle_variance_penalty: 1.0    

    fine_search_angle_offset: 0.00349     
    coarse_search_angle_offset: 0.349   
    coarse_angle_resolution: 0.0349        
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1

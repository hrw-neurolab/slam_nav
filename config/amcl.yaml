# AMCL for navigating on a map that SLAM has drawn.
# Same values as config/amcl.yaml of day 6 (package mcl_room), except:
#   laser_max_range     3.5 m, the range of our lidar
#   set_initial_pose    true: the robot starts where the SLAM map frame was set,
#                       so its pose in that map is (0, 0, 0). No "2D Pose Estimate" needed.
#   recovery alphas     0.0, the Nav2 default, no kidnapping today
amcl:
  ros__parameters:
    use_sim_time: false
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint
    scan_topic: scan
    map_topic: map

    # motion model, day 6 slide 10
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    # sensor model, day 6 slide 11
    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 2.0
    laser_max_range: 3.5
    laser_min_range: 0.12
    max_beams: 60
    sigma_hit: 0.2
    z_hit: 0.5
    z_rand: 0.5
    z_short: 0.05
    z_max: 0.05

    # particles and KLD sampling, day 6 slides 12 and 14
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1

    # random particles against kidnapping, off (Nav2 default)
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0

    # update only after this much motion
    update_min_d: 0.1
    update_min_a: 0.1

    # tf map -> odom
    tf_broadcast: true
    transform_tolerance: 1.0
    save_pose_rate: 0.5

    # the robot starts at the origin of the SLAM map
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
